<svg viewBox="0 0 840 280" xmlns="http://www.w3.org/2000/svg" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;display=swap');
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="840" height="280" rx="12" fill="#0d1117"/>
  
  <!-- Scanline effect -->
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="rgba(255,255,255,0.015)"/>
  </pattern>
  <rect width="840" height="280" rx="12" fill="url(#scanlines)"/>
  
  <!-- Stars / sparkles -->
  <circle cx="45" cy="35" r="1.5" fill="#ffd6e0" opacity="0.6"/>
  <circle cx="120" cy="60" r="1" fill="#ffc2d1" opacity="0.4"/>
  <circle cx="200" cy="25" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="310" cy="50" r="1" fill="#ffd6e0" opacity="0.5"/>
  <circle cx="500" cy="30" r="1.5" fill="#fff" opacity="0.25"/>
  <circle cx="620" cy="55" r="1" fill="#ffc2d1" opacity="0.4"/>
  <circle cx="750" cy="25" r="1.5" fill="#ffd6e0" opacity="0.35"/>
  <circle cx="780" cy="65" r="1" fill="#fff" opacity="0.3"/>
  
  <!-- ======================== -->
  <!-- CHERRY BLOSSOM TREE      -->
  <!-- ======================== -->
  
  <!-- Trunk -->
  <g fill="#8B5E3C">
    <rect x="680" y="140" width="8" height="8"/>
    <rect x="680" y="148" width="8" height="8"/>
    <rect x="680" y="156" width="8" height="8"/>
    <rect x="680" y="164" width="8" height="8"/>
    <rect x="680" y="172" width="8" height="8"/>
    <rect x="680" y="180" width="8" height="8"/>
    <rect x="680" y="188" width="8" height="8"/>
    <rect x="680" y="196" width="8" height="8"/>
    <rect x="680" y="204" width="8" height="8"/>
    <rect x="680" y="212" width="8" height="8"/>
    <rect x="680" y="220" width="8" height="8"/>
    <rect x="680" y="228" width="8" height="8"/>
    <rect x="680" y="236" width="8" height="8"/>
    <!-- branch left -->
    <rect x="672" y="164" width="8" height="8"/>
    <rect x="664" y="156" width="8" height="8"/>
    <rect x="656" y="148" width="8" height="8"/>
    <rect x="648" y="140" width="8" height="8"/>
    <!-- branch right -->
    <rect x="688" y="156" width="8" height="8"/>
    <rect x="696" y="148" width="8" height="8"/>
    <rect x="704" y="140" width="8" height="8"/>
    <rect x="712" y="132" width="8" height="8"/>
    <!-- small left branch -->
    <rect x="672" y="188" width="8" height="8"/>
    <rect x="664" y="180" width="8" height="8"/>
    <!-- small right branch upper -->
    <rect x="688" y="180" width="8" height="8"/>
    <rect x="696" y="172" width="8" height="8"/>
  </g>
  
  <!-- Blossoms - bright pink clusters -->
  <g fill="#FF6B9D">
    <!-- top canopy -->
    <rect x="664" y="108" width="8" height="8"/>
    <rect x="672" y="108" width="8" height="8"/>
    <rect x="680" y="108" width="8" height="8"/>
    <rect x="688" y="108" width="8" height="8"/>
    <rect x="656" y="116" width="8" height="8"/>
    <rect x="672" y="116" width="8" height="8"/>
    <rect x="688" y="116" width="8" height="8"/>
    <rect x="696" y="116" width="8" height="8"/>
    <rect x="664" y="124" width="8" height="8"/>
    <rect x="680" y="124" width="8" height="8"/>
    <rect x="696" y="124" width="8" height="8"/>
    <rect x="672" y="132" width="8" height="8"/>
    <rect x="680" y="132" width="8" height="8"/>
    <!-- right branch blossoms -->
    <rect x="712" y="116" width="8" height="8"/>
    <rect x="720" y="116" width="8" height="8"/>
    <rect x="712" y="124" width="8" height="8"/>
    <rect x="720" y="124" width="8" height="8"/>
    <rect x="728" y="124" width="8" height="8"/>
    <rect x="720" y="132" width="8" height="8"/>
    <!-- left branch blossoms -->
    <rect x="640" y="132" width="8" height="8"/>
    <rect x="648" y="132" width="8" height="8"/>
    <rect x="640" y="140" width="8" height="8"/>
    <rect x="632" y="140" width="8" height="8"/>
    <rect x="648" y="124" width="8" height="8"/>
    <!-- small left branch blossoms -->
    <rect x="656" y="172" width="8" height="8"/>
    <rect x="648" y="172" width="8" height="8"/>
    <rect x="656" y="164" width="8" height="8"/>
    <!-- small right branch blossoms -->
    <rect x="704" y="164" width="8" height="8"/>
    <rect x="696" y="164" width="8" height="8"/>
    <rect x="704" y="156" width="8" height="8"/>
  </g>
  
  <!-- Blossoms - lighter pink highlights -->
  <g fill="#FFB3D0">
    <rect x="672" y="100" width="8" height="8"/>
    <rect x="688" y="100" width="8" height="8"/>
    <rect x="656" y="108" width="8" height="8"/>
    <rect x="696" y="108" width="8" height="8"/>
    <rect x="704" y="108" width="8" height="8"/>
    <rect x="648" y="116" width="8" height="8"/>
    <rect x="704" y="116" width="8" height="8"/>
    <rect x="656" y="124" width="8" height="8"/>
    <rect x="728" y="116" width="8" height="8"/>
    <rect x="632" y="132" width="8" height="8"/>
    <rect x="640" y="124" width="8" height="8"/>
    <rect x="648" y="164" width="8" height="8"/>
    <rect x="712" y="156" width="8" height="8"/>
  </g>
  
  <!-- White blossom centers -->
  <g fill="#FFEEF4">
    <rect x="680" y="100" width="8" height="8"/>
    <rect x="680" y="116" width="8" height="8"/>
    <rect x="688" y="124" width="8" height="8"/>
    <rect x="720" y="120" width="4" height="4"/>
    <rect x="644" y="136" width="4" height="4"/>
    <rect x="660" y="168" width="4" height="4"/>
    <rect x="700" y="160" width="4" height="4"/>
  </g>
  
  <!-- Falling petals -->
  <g fill="#FF6B9D" opacity="0.7">
    <rect x="630" y="200" width="6" height="6" transform="rotate(15 633 203)"/>
    <rect x="710" y="190" width="5" height="5" transform="rotate(-20 712 192)"/>
    <rect x="660" y="220" width="5" height="5" transform="rotate(30 662 222)"/>
    <rect x="720" y="215" width="4" height="4" transform="rotate(-10 722 217)"/>
    <rect x="645" y="245" width="5" height="5" transform="rotate(25 647 247)"/>
    <rect x="700" y="240" width="4" height="4" transform="rotate(-35 702 242)"/>
    <rect x="735" y="195" width="4" height="4" transform="rotate(40 737 197)"/>
  </g>
  <g fill="#FFB3D0" opacity="0.5">
    <rect x="620" y="230" width="5" height="5" transform="rotate(-25 622 232)"/>
    <rect x="740" y="230" width="4" height="4" transform="rotate(20 742 232)"/>
    <rect x="690" y="250" width="5" height="5" transform="rotate(-15 692 252)"/>
  </g>
  
  <!-- Ground line -->
  <rect x="620" y="244" width="160" height="2" fill="#1a3a1a" opacity="0.4" rx="1"/>
  <g fill="#2d5a2d" opacity="0.3">
    <rect x="660" y="240" width="6" height="6"/>
    <rect x="695" y="238" width="8" height="8"/>
    <rect x="710" y="240" width="6" height="6"/>
  </g>
  
  <!-- ======================== -->
  <!-- PIXEL TEXT: SREEYA       -->
  <!-- ======================== -->
  
  <!-- Using Silkscreen pixel font as primary, with fallback -->
  <text x="60" y="148" 
        font-family="'Silkscreen', 'Press Start 2P', 'Courier New', monospace" 
        font-size="64" 
        font-weight="700" 
        fill="#0EF6CC"
        letter-spacing="6">SREEYA</text>
  
  <!-- Subtitle -->
  <text x="62" y="180" 
        font-family="'Silkscreen', 'Press Start 2P', 'Courier New', monospace" 
        font-size="13" 
        fill="#8b949e"
        letter-spacing="2">builder · backend + AI · GSoC '26 @ IOOS</text>
  
  <!-- Tagline -->
  <text x="62" y="210" 
        font-family="'Silkscreen', 'Press Start 2P', 'Courier New', monospace" 
        font-size="11" 
        fill="#FF6B9D"
        letter-spacing="1">&gt; I build things that actually work_</text>
  
  <!-- Border decoration - pixel corners -->
  <g fill="#0EF6CC" opacity="0.3">
    <!-- top-left corner -->
    <rect x="16" y="16" width="4" height="4"/>
    <rect x="20" y="16" width="4" height="4"/>
    <rect x="24" y="16" width="4" height="4"/>
    <rect x="16" y="20" width="4" height="4"/>
    <rect x="16" y="24" width="4" height="4"/>
    <!-- top-right corner -->
    <rect x="816" y="16" width="4" height="4"/>
    <rect x="812" y="16" width="4" height="4"/>
    <rect x="808" y="16" width="4" height="4"/>
    <rect x="816" y="20" width="4" height="4"/>
    <rect x="816" y="24" width="4" height="4"/>
    <!-- bottom-left corner -->
    <rect x="16" y="256" width="4" height="4"/>
    <rect x="20" y="256" width="4" height="4"/>
    <rect x="24" y="256" width="4" height="4"/>
    <rect x="16" y="252" width="4" height="4"/>
    <rect x="16" y="248" width="4" height="4"/>
    <!-- bottom-right corner -->
    <rect x="816" y="256" width="4" height="4"/>
    <rect x="812" y="256" width="4" height="4"/>
    <rect x="808" y="256" width="4" height="4"/>
    <rect x="816" y="252" width="4" height="4"/>
    <rect x="816" y="248" width="4" height="4"/>
  </g>
  
  <!-- Pixel border lines -->
  <g fill="#0EF6CC" opacity="0.1">
    <rect x="32" y="16" width="772" height="2"/>
    <rect x="32" y="258" width="772" height="2"/>
    <rect x="16" y="32" width="2" height="220"/>
    <rect x="818" y="32" width="2" height="220"/>
  </g>
  
</svg>
